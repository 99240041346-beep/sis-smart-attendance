services:
  - type: web
    name: harsha-sis-smart-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sis-smart-attendance-db
          property: connectionString

databases:
  - name: sis-smart-attendance-db
    databaseName: sis_attendance
    user: sis_admin
    plan: free
